name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Get OCR model
        run: ./Get-Tessdata.ps1
      - name: Publish
        run: dotnet publish HdmAutomation.csproj -c Release -r win-x64 --self-contained -o publish/HdmAutomation
      - uses: actions/upload-artifact@v4
        with:
          name: HdmAutomation-win-x64
          path: publish/HdmAutomation
